services:
  - type: web
    name: bhumi-portal
    runtime: python
    plan: starter          # persistent disks require a paid plan (free plan has no disk support)
    buildCommand: "pip install -r requirements.txt && python init_db.py --if-missing"
    startCommand: "gunicorn app:app"
    envVars:
      - key: BHUMI_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/bhumi.db
    disk:
      name: bhumi-data
      mountPath: /var/data
      sizeGB: 1
