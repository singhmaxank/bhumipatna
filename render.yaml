services:
  - type: web
    name: bhumi-portal
    runtime: python
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python -m gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: BHUMI_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false   # set this to your Supabase/PostgreSQL connection string in the Render dashboard
