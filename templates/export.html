<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhumi Patna - Generating PDF...</title>
    <link rel="icon" href="{{ url_for('static', filename='img/bhumi_logo.png') }}" type="image/png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background: #f4f6f8; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #374151; }
        .spinner-box { text-align: center; background: white; padding: 30px 50px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #059669; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* FIXED PDF WIDTH: 750px ensures it will not get cut off by the PDF generator */
        #printable-document-canvas {
            background: #ffffff; 
            padding: 30px; 
            width: 750px; 
            box-sizing: border-box;
            color: #111827;
        }
        .doc-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #059669; padding-bottom: 20px; margin-bottom: 25px; }
        .brand-title { font-size: 1.8rem; font-weight: 800; color: #059669; }
        .meta-text { font-size: 0.85rem; color: #6b7280; text-align: right; line-height: 1.5; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #e5e7eb; text-align: left; font-size: 0.9rem; }
        th { background-color: #f9fafb; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; color: #4b5563; }
        .amount-highlight { color: #059669; font-weight: 700; font-size: 0.95rem; }
        .badge-print { font-weight: 600; text-transform: capitalize; font-size: 0.85rem; }
    </style>
</head>
<body>

    <div class="spinner-box">
        <div class="spinner"></div>
        <div style="font-weight: 700; font-size: 1.05rem;">Generating Data Report...</div>
        <div style="font-size: 0.82rem; color: #9ca3af; margin-top: 5px;">Building PDF Document...</div>
    </div>

    <!-- Hidden Layout Target Canvas -->
    <div style="display: none;">
        <div id="printable-document-canvas">
            <div class="doc-header">
                <div>
                    <div class="brand-title">Bhumi Patna</div>
                    <div style="font-size: 0.9rem; font-weight: 600; color: #4b5563; margin-top: 4px;">User Performance Report</div>
                </div>
                <div class="meta-text">
                    <div><strong>Date Generated:</strong> <span id="liveDate"></span></div>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Email Address</th>
                        <th>Total Raised</th>
                    </tr>
                </thead>
                <tbody>
                    {% for u in users %}
                    <tr>
                        <td><strong style="color: #111827; font-weight: 700;">{{ u.full_name }}</strong></td>
                        <td><span class="badge-print">{{ u.role }}</span></td>
                        <td style="color: #4b5563;">{{ u.email }}</td>
                        <td class="amount-highlight">₹ {{ u.total_raised }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('liveDate').innerText = new Date().toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        window.addEventListener("DOMContentLoaded", function() {
            var element = document.getElementById('printable-document-canvas');
            var configurationOptions = {
                margin:       0.3,
                filename:     'Bhumi_Patna_Data_Report.pdf',
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };

            html2pdf().set(configurationOptions).from(element).save().then(function() {
                window.location.href = '/admin';
            }).catch(function(err) {
                console.error("PDF generation failed: ", err);
                window.location.href = '/admin';
            });
        });
    </script>
</body>
</html>
