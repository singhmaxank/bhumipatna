{% extends 'base.html' %}
{% block title %}Edit User{% endblock %}
{% block page_name %}Modify Account{% endblock %}

{% block content %}
<div class="grid" style="justify-content: center; display: flex;">
    <div class="card" style="width: 100%; max-width: 700px;">
        <h3 class="card-title" style="margin-bottom: 24px;">Update Details for {{ user.full_name }}</h3>
        
        <form method="POST" action="/admin/users/edit/{{ user.id }}">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group"><label>Full Name</label><input type="text" name="full_name" value="{{ user.full_name }}" class="form-control" required></div>
                <div class="form-group"><label>Username</label><input type="text" name="username" value="{{ user.username }}" class="form-control" required></div>
            </div>
            
            <div class="form-group"><label>Email Address</label><input type="email" name="email" value="{{ user.email }}" class="form-control" required></div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Role</label>
                    <select name="role" class="form-control" required>
                        <option value="intern" {% if user.role == 'intern' %}selected{% endif %}>Intern</option>
                        <option value="ambassador" {% if user.role == 'ambassador' %}selected{% endif %}>Campus Ambassador</option>
                        <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Reporting Head</label>
                    <select name="head_id" class="form-control">
                        <option value="">None</option>
                        {% for admin in admins %}
                            <option value="{{ admin.id }}" {% if user.head_id == admin.id %}selected{% endif %}>{{ admin.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 10px; padding-top: 20px; border-top: 1px solid var(--border-color);">
                <label style="color: var(--primary);">Change Password</label>
                <input type="text" name="new_password" placeholder="Leave blank to keep current password" class="form-control">
            </div>
            
            <div style="display: flex; gap: 16px; margin-top: 10px;">
                <button type="submit" class="btn-main" style="flex: 2;">Save Changes</button>
                <a href="/admin" class="btn-main" style="flex: 1; background: transparent; border: 1px solid var(--border-color); color: var(--text-dark);">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
