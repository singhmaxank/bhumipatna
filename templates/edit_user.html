{% extends 'base.html' %}
{% block title %}Bhumi Patna Portal - Edit User{% endblock %}

{% block content %}
<div class="admin-section" style="max-width: 700px;">
    <h2>Edit User Profile</h2>
    <p class="subtext" style="margin-bottom: 2rem;">Update details for {{ user.full_name }}</p>
    
    <form method="POST" action="/admin/users/edit/{{ user.id }}">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" name="full_name" value="{{ user.full_name }}" required>
        </div>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" value="{{ user.username }}" required>
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" value="{{ user.email }}" required>
        </div>

        <div class="form-group">
            <label>User Role</label>
            <select name="role" required>
                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Administrator</option>
                <option value="intern" {% if user.role == 'intern' %}selected{% endif %}>Intern</option>
                <option value="ambassador" {% if user.role == 'ambassador' %}selected{% endif %}>Campus Ambassador</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.5rem;">
            <div class="form-group">
                <label>Tenure Start Date</label>
                <input type="date" name="tenure_start" value="{{ user.tenure_start }}">
            </div>
            <div class="form-group">
                <label>Tenure End Date</label>
                <input type="date" name="tenure_end" value="{{ user.tenure_end }}">
            </div>
        </div>

        <div class="form-group" style="margin-top: 1rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <label style="color: var(--primary);">Reset User Password</label>
            <p class="subtext" style="margin-bottom: 0.5rem;">Leave blank to keep current password.</p>
            <input type="text" name="new_password" placeholder="Enter a new password">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn">Save Changes</button>
            <a href="/admin" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
