{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto; background: #fff; padding: 2rem; border: 1px solid var(--border-color); border-radius: 8px;">
    <h2 style="text-align: center;">Reset Password</h2>
    <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Enter your email to receive reset instructions.</p>
    
    <form method="POST" action="/forgot-password">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Send Reset Link</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
        <a href="/login">&larr; Back to Login</a>
    </div>
</div>
{% endblock %}
