{% extends 'base.html' %}
{% block title %}Bhumi Patna Portal - Reset Password{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;" class="admin-section">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Reset Password</h2>
        <p style="color: var(--text-muted);">Enter your email to receive instructions.</p>
    </div>
    
    <form method="POST" action="/forgot-password">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Send Reset Link</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; font-weight: 600;">
        <a href="/login">&larr; Back to Login</a>
    </div>
</div>
{% endblock %}
