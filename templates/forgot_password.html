{% extends 'base.html' %}
{% block title %}Bhumi Patna Portal - Reset Password{% endblock %}

{% block content %}
<div class="admin-section" style="max-width: 420px; margin: 4rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Reset Password</h2>
        <p class="subtext" style="font-size: 0.95rem;">Enter your email to receive instructions.</p>
    </div>
    
    <form method="POST" action="/forgot-password">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Send Reset Link</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center;">
        <a href="/login" style="font-size: 0.85rem; font-weight: 700; color: var(--primary);">&larr; Back to Login</a>
    </div>
</div>
{% endblock %}
