{% extends 'base.html' %}
{% block page_name %}Dashboard{% endblock %}
{% block content %}
<div class="grid">
    <!-- Simple Cards -->
    <div class="card col-3">
        <div class="card-title">Total Raised</div>
        <div class="stat-value">₹{{ total_raised }}</div>
    </div>
    <div class="card col-3">
        <div class="card-title">Total Interns</div>
        <div class="stat-value">{{ interns|length }}</div>
    </div>
    
    <!-- Filter -->
    <div class="card col-6">
        <div class="card-title">Filter Data</div>
        <select onchange="window.location.href='/admin?days='+this.value" class="form-control">
            <option value="7" {% if selected_days==7 %}selected{% endif %}>Last 7 Days</option>
            <option value="30" {% if selected_days==30 %}selected{% endif %}>Last 30 Days</option>
        </select>
    </div>

    <!-- Notices -->
    <div class="card col-12">
        <h3 class="card-title">Post Announcement</h3>
        <form action="/admin/announcement" method="POST" style="display:flex; gap:10px;">
            <input type="text" name="content" class="form-control" placeholder="Type here..." required>
            <button type="submit" class="btn-main" style="width: auto;">Post</button>
        </form>
    </div>
</div>
{% endblock %}
