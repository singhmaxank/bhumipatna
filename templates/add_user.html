{% extends 'base.html' %}
{% block title %}Add User{% endblock %}
{% block page_name %}Account Creation{% endblock %}

{% block content %}
<div class="grid" style="justify-content: center; display: flex;">
    <div class="card" style="width: 100%; max-width: 700px;">
        <h3 class="card-title" style="margin-bottom: 24px;">New User Details</h3>
        
        <form method="POST" action="/admin/users/add">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group"><label>Full Name</label><input type="text" name="full_name" class="form-control" required></div>
                <div class="form-group"><label>Username</label><input type="text" name="username" class="form-control" required></div>
            </div>
            
            <div class="form-group"><label>Email Address</label><input type="email" name="email" class="form-control" required></div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group"><label>Password</label><input type="text" name="password" class="form-control" required></div>
                <div class="form-group">
                    <label>Role</label>
                    <select name="role" class="form-control" required>
                        <option value="intern">Intern</option>
                        <option value="ambassador">Campus Ambassador</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Reporting Head (Optional)</label>
                <select name="head_id" class="form-control">
                    <option value="">None (Direct to Main Admin)</option>
                    {% for admin in admins %}
                        <option value="{{ admin.id }}">{{ admin.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div style="display: flex; gap: 16px; margin-top: 10px;">
                <button type="submit" class="btn-main" style="flex: 2;">Create Account</button>
                <a href="/admin" class="btn-main" style="flex: 1; background: transparent; border: 1px solid var(--border-color); color: var(--text-dark);">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
