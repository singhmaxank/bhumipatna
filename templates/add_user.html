{% extends 'base.html' %}
{% block title %}Bhumi Patna Portal - Add User{% endblock %}

{% block content %}
<div class="admin-section" style="max-width: 700px; margin: 0 auto;">
    <h2>Add New User</h2>
    <p class="subtext" style="margin-bottom: 2rem; font-size: 0.95rem;">Create a new profile for an intern, ambassador, or admin.</p>
    
    <form method="POST" action="/admin/users/add">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group">
                <label>Password</label>
                <input type="text" name="password" required>
            </div>
            <div class="form-group">
                <label>User Role</label>
                <select name="role" required>
                    <option value="intern">Intern</option>
                    <option value="ambassador">Campus Ambassador</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-top: 0.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <div class="form-group">
                <label>Tenure Start</label>
                <input type="date" name="tenure_start">
            </div>
            <div class="form-group">
                <label>Tenure End</label>
                <input type="date" name="tenure_end">
            </div>
            <!-- NEW HEAD SELECTOR -->
            <div class="form-group">
                <label>Reporting Head (Admin)</label>
                <select name="head_id">
                    <option value="">None (Main Admin)</option>
                    {% for admin in admins %}
                        <option value="{{ admin.id }}">{{ admin.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
            <button type="submit" class="btn" style="flex: 1;">Create User</button>
            <a href="/admin" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
