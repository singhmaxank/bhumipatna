{% extends 'base.html' %}
{% block title %}Add User{% endblock %}
{% block page_name %}Create Account{% endblock %}

{% block content %}
<div class="grid-layout" style="justify-content: center; display: flex;">
    <div class="bento-card" style="width: 100%; max-width: 600px;">
        <div class="card-head">
            <h3>User Details</h3>
        </div>
        
        <form method="POST" action="/admin/users/add">
            <div style="display: flex; gap: 20px;">
                <div class="input-wrap" style="flex: 1;">
                    <label>Full Name</label>
                    <input type="text" name="full_name" class="input-field" required>
                </div>
                <div class="input-wrap" style="flex: 1;">
                    <label>Username</label>
                    <input type="text" name="username" class="input-field" required>
                </div>
            </div>
            
            <div class="input-wrap">
                <label>Email Address</label>
                <input type="email" name="email" class="input-field" required>
            </div>
            
            <div style="display: flex; gap: 20px;">
                <div class="input-wrap" style="flex: 1;">
                    <label>Password</label>
                    <input type="text" name="password" class="input-field" required>
                </div>
                <div class="input-wrap" style="flex: 1;">
                    <label>Role</label>
                    <select name="role" required>
                        <option value="intern">Intern</option>
                        <option value="ambassador">Campus Ambassador</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>
            </div>
            
            <div class="input-wrap">
                <label>Reporting Head</label>
                <select name="head_id">
                    <option value="">None</option>
                    {% for admin in admins %}
                        <option value="{{ admin.id }}">{{ admin.full_name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div style="display: flex; gap: 15px; margin-top: 10px;">
                <button type="submit" class="btn-primary" style="flex: 2;">Create User</button>
                <a href="/admin" class="btn-primary btn-outline" style="flex: 1;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
