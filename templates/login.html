{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto; background: #fff; padding: 2rem; border: 1px solid var(--border-color); border-radius: 8px; text-align: center;">
    <h2>Sign In</h2>
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. bhumi" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Login</button>
    </form>
    
    <div style="margin-top: 1.5rem; font-size: 0.875rem;">
        <a href="/forgot-password">Forgot password?</a>
    </div>
</div>
{% endblock %}
