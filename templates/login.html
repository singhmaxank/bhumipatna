{% extends 'base.html' %}
{% block title %}Bhumi Patna Portal - Login{% endblock %}

{% block content %}
<div class="admin-section" style="max-width: 420px; margin: 4rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Welcome Back</h2>
        <p class="subtext">Sign in to track your impact.</p>
    </div>
    
    <form method="POST" action="/login">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="e.g. bhumi" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center;">
        <a href="/forgot-password" style="font-size: 0.85rem; font-weight: 600;">Forgot your password?</a>
    </div>
</div>
{% endblock %}
