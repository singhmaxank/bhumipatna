{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 2rem auto; background: #fff; padding: 2rem; border: 1px solid #e5e7eb; border-radius: 8px;">
    <h2>Login</h2>
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Sign In</button>
    </form>
    
    <div style="margin-top: 1rem; text-align: center; font-size: 0.875rem;">
        <a href="/forgot-password" style="color: #6b7280;">Forgot password?</a>
    </div>
</div>
{% endblock %}
