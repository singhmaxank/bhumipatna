{% extends 'base.html' %}
{% block title %}Bhumi Patna Portal - Login{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;" class="admin-section">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h2>Welcome Back</h2>
        <p style="color: var(--text-muted);">Sign in to track your environmental impact.</p>
    </div>
    
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="e.g. bhumi" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; font-weight: 600;">
        <a href="/forgot-password">Forgot your password?</a>
    </div>
</div>
{% endblock %}
