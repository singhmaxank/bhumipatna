{% extends 'base.html' %}
{% block page_name %}Intern Dashboard{% endblock %}
{% block content %}
<div class="grid">
    <div class="card col-6">
        <div class="card-title">My Total Raised</div>
        <div class="stat-value">₹{{ total_raised }}</div>
    </div>

    <!-- Announcement Feed -->
    <div class="card col-6">
        <div class="card-title">Announcements</div>
        {% for post in announcements %}
            <div style="padding: 10px; border-bottom: 1px solid var(--border-color);">{{ post.content }}</div>
        {% endfor %}
    </div>

    <!-- Logger -->
    <div class="card col-12">
        <h3 class="card-title">Log Donation</h3>
        <form action="/submit-donation" method="POST" class="grid" style="gap:10px;">
            <input type="text" name="donor_name" class="form-control col-4" placeholder="Donor Name" required>
            <input type="number" name="amount" class="form-control col-4" placeholder="Amount" required>
            <input type="url" name="screenshot_url" class="form-control col-4" placeholder="Drive URL" required>
            <button type="submit" class="btn-main col-12">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
