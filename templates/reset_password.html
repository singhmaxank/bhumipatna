{% extends "base.html" %}
{% block title %}Set new password &middot; Bhumi Patna Portal{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12" style="background-color: var(--bg);">
  <div class="w-full max-w-sm">

    <div class="flex flex-col items-center mb-8">
      <img src="{{ url_for('static', filename='img/bhumi_logo.png') }}" alt="Bhumi logo" class="h-16 w-auto mb-4">
      <h1 class="text-xl font-semibold" style="color: var(--ink);">Set a new password</h1>
      <p class="text-sm mt-1" style="color: var(--ink-soft);">Choose a password you haven't used before.</p>
    </div>

    <div class="card rounded-lg p-6 sm:p-7">
      <form method="POST" action="{{ url_for('reset_password') }}" class="space-y-4">
        <div>
          <label for="new_password" class="block field-label mb-1.5">New password</label>
          <input type="password" id="new_password" name="new_password" required minlength="6" autofocus
            class="field-input w-full px-3.5 py-2.5 text-sm" placeholder="At least 6 characters">
        </div>
        <div>
          <label for="confirm_password" class="block field-label mb-1.5">Confirm password</label>
          <input type="password" id="confirm_password" name="confirm_password" required minlength="6"
            class="field-input w-full px-3.5 py-2.5 text-sm" placeholder="Retype password">
        </div>
        <button type="submit" class="btn-primary w-full py-2.5 rounded-md text-sm">Update password</button>
      </form>
    </div>

  </div>
</div>
{% endblock %}
