<div class="card-row px-5 py-4 user-row" data-search="{{ (u.full_name ~ ' ' ~ u.username)|lower }}" data-manager="{{ u.assigned_admin_id or '' }}">
  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div class="flex items-center gap-3">
      <span class="avatar h-9 w-9 text-xs" style="background: {{ u.full_name|avatar_color }};">{{ u.full_name|initials }}</span>
      <div>
        <p class="font-medium text-sm">{{ u.full_name }}</p>
        <p class="text-xs" style="color: var(--ink-soft);">
          @{{ u.username }}{% if u.tenure_end %} &middot; ends {{ u.tenure_end }}{% endif %}{% if u.email %} &middot; {{ u.email }}{% endif %}
        </p>
        <p class="text-xs mt-0.5" style="color: var(--ink-soft);">
          Managed by: {% if u.manager_name %}<span class="font-medium">{{ u.manager_name }}</span>{% else %}<span>Unassigned</span>{% endif %}
        </p>
      </div>
    </div>
    <div class="flex gap-2 shrink-0">
      <button type="button" onclick="document.getElementById('user-edit-{{ u.id }}').classList.toggle('hidden')" class="btn-outline px-2.5 py-1 rounded-md text-xs">Edit</button>
      <form method="POST" action="{{ url_for('delete_user', user_id=u.id) }}" onsubmit="return confirm('Delete {{ u.full_name }}? This also removes their donation history and task completions. This cannot be undone.');">
        <button type="submit" class="btn-danger-outline px-2.5 py-1 rounded-md text-xs">Delete</button>
      </form>
    </div>
  </div>

  <form id="user-edit-{{ u.id }}" method="POST" action="{{ url_for('edit_user', user_id=u.id) }}" class="hidden mt-3 space-y-2 border-t pt-3" style="border-color: var(--border);">
    <div class="grid sm:grid-cols-2 gap-2">
      <input type="text" name="full_name" value="{{ u.full_name }}" required placeholder="Full name" class="w-full px-3 py-2 rounded-md border text-sm" style="border-color: var(--border);">
      <input type="email" name="email" value="{{ u.email or '' }}" required placeholder="Email" class="w-full px-3 py-2 rounded-md border text-sm" style="border-color: var(--border);">
    </div>
    <div class="grid sm:grid-cols-2 gap-2">
      <input type="text" name="phone" value="{{ u.phone or '' }}" placeholder="Phone" class="w-full px-3 py-2 rounded-md border text-sm" style="border-color: var(--border);">
      <input type="text" name="new_password" placeholder="New password (leave blank to keep current)" class="w-full px-3 py-2 rounded-md border text-sm" style="border-color: var(--border);">
    </div>
    <div>
      <label class="block text-xs mb-1" style="color: var(--ink-soft);">Managed by</label>
      <select name="assigned_admin_id" class="w-full px-3 py-2 rounded-md border text-sm" style="border-color: var(--border);">
        <option value="">Unassigned</option>
        {% for a in admins %}
        <option value="{{ a.id }}" {% if u.assigned_admin_id == a.id %}selected{% endif %}>{{ a.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid sm:grid-cols-2 gap-2">
      <div>
        <label class="block text-xs mb-1" style="color: var(--ink-soft);">Tenure start</label>
        <input type="date" name="tenure_start" value="{{ u.tenure_start or '' }}" class="w-full px-3 py-2 rounded-md border text-sm" style="border-color: var(--border);">
      </div>
      <div>
        <label class="block text-xs mb-1" style="color: var(--ink-soft);">Tenure end</label>
        <input type="date" name="tenure_end" value="{{ u.tenure_end or '' }}" class="w-full px-3 py-2 rounded-md border text-sm" style="border-color: var(--border);">
      </div>
    </div>
    <button type="submit" class="btn-primary w-full py-2 rounded-md text-xs">Save changes</button>
  </form>
</div>
